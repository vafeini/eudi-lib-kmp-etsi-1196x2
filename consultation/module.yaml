product:
  type: kmp/lib
  platforms: [jvm, android, iosArm64, iosX64, iosSimulatorArm64]

description: A library for checking certificates against ETSI 1196x2 standards

apply:
  - //publishing.module-template.yaml

aliases:
  - jvmAndAndroid: [jvm, android]

settings:
  kotlin:
    compileIncrementally: false
    languageVersion: 2.2
    optIns:
      - kotlin.io.encoding.ExperimentalEncodingApi
      - kotlin.ExperimentalStdlibApi
      - kotlin.time.ExperimentalTime
      - kotlin.contracts.ExperimentalContracts
      - kotlinx.cinterop.ExperimentalForeignApi
    explicitApi: warning
  android:
    namespace: eu.europa.ec.eudi.etsi1196x2.consultation
    compileSdk: 34
    minSdk: 26
  jvm:
    jdk:
      version: 17
  publishing:
    enabled: true
    artifactId: etsi-1196x2-consultation

settings@ios:
  kotlin:
    freeCompilerArgs: ["-Xoverride-konan-properties=minVersion.ios=15.0"]
    
settings@iosArm64:  # Device only
  kotlin:
    linkerOptions:
      - -L/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos

settings@iosX64:  # Simulator x86_64
  kotlin:
    linkerOptions:
      - -L/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphonesimulator

settings@iosSimulatorArm64:  # Simulator arm64
  kotlin:
    linkerOptions:
      - -L/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphonesimulator

dependencies:
  - $libs.kotlinx.coroutines.core: exported
  - $libs.atomicfu

dependencies@jvmAndAndroid:
  - $libs.bouncy.castle
  - $libs.slf4j.api

dependencies@ios:
  - swiftPackage:
      products: [PKIXBridge]
      repository: https://github.com/vafeini/PKIXBridge.git
      version:
        type: revision
        value: 8cd6c33649919133501a54045b60db544fa7716b

test-dependencies:
  - $libs.kotlinx.coroutines.test

mavenPlugins:
  kover-maven-plugin.report-xml:
    enabled: true
    configuration:
      xmlFile: build/reports/kover/report.xml