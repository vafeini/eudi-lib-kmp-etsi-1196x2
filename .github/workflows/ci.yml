name: CI

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
  push:

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: "1"

jobs:
  build-toolchain:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    outputs:
      code-version: ${{ steps.extract.outputs.CODE_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Kotlin toolchain
        run: |
          curl -fsSL https://kotl.in/install.sh | sh          
          exec $SHELL
      - name: Build
        env:
          CI: true
        run: ./kotlin build
      - name: Test
        env:
          CI: true
        run: ./kotlin test --p jvm
      - id: extract
        if: matrix.os == 'ubuntu-latest' # Extract version only once
        name: Extract code version
        run: |
          echo "CODE_VERSION=$(awk -F': *' '/^    version:/{print $2; exit}' publishing.module-template.yaml)" >> $GITHUB_OUTPUT

  publish-to-sonatype-snapshot:
    name: Publish to sonatype.org (SNAPSHOT)
    needs: [ build-toolchain ]
    if: github.event_name != 'pull_request' && endsWith(needs.build-toolchain.outputs.code-version, '-SNAPSHOT') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release')) &&  github.repository_owner == 'eu-digital-identity-wallet'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish to Maven Central
        env:
          CI: true
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: ./kotlin publish mavenCentral
